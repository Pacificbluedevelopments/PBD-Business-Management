<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Pipeline — Pacific Blue</title>
  <link rel="stylesheet" href="./styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Summary cards ── */
    .summary-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: #fff; border: 1px solid #E5E3E0; border-radius: 8px;
      padding: 18px 20px; display: flex; flex-direction: column; gap: 4px;
    }
    .summary-card-label {
      font-size: 11px; font-weight: 600; color: #6B7280;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .summary-card-value {
      font-size: 20px; font-weight: 600; color: #333F48;
    }

    /* ── Actions banner ── */
    .actions-banner {
      display: none; padding: 14px 18px; background: #FEF3E2;
      border: 1px solid #F6D860; border-radius: 8px;
      color: #B7791F; font-size: 13px; margin-bottom: 20px; line-height: 1.5;
    }
    .actions-banner.show { display: block; }
    .actions-banner strong { color: #333F48; }

    /* ── Likelihood colour ── */
    .lh-high   { color: #2D6A4F; font-weight: 600; }
    .lh-medium { color: #B7791F; font-weight: 600; }
    .lh-low    { color: #9B2335; font-weight: 600; }
    .badge-high   { background: #EAF5EF; color: #2D6A4F; }
    .badge-medium { background: #FEF3E2; color: #B7791F; }
    .badge-low    { background: #FDEDF0; color: #9B2335; }

    /* ── Inline edit panel ── */
    .edit-panel-row td { padding: 0; }
    .edit-panel {
      background: #FAFAF9; border-top: 2px solid #B7B09C;
      border-bottom: 1px solid #E5E3E0; padding: 20px 24px;
    }
    .edit-panel-title { font-size: 13px; font-weight: 600; color: #333F48; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.4px; }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px 20px; }
    .edit-group { display: flex; flex-direction: column; gap: 5px; }
    .edit-group.span-2 { grid-column: span 2; }
    .edit-group.span-3 { grid-column: span 3; }
    .edit-group label { font-size: 10px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'Poppins', sans-serif; }
    .edit-group input, .edit-group select, .edit-group textarea {
      font-family: 'Poppins', sans-serif; font-size: 13px; color: #333F48;
      background: #fff; border: 1px solid #E5E3E0; border-radius: 6px;
      padding: 7px 10px; width: 100%; appearance: none; transition: border-color 0.2s;
    }
    .edit-group input:focus, .edit-group select:focus, .edit-group textarea:focus { outline: none; border-color: #333F48; }
    .edit-group textarea { resize: vertical; min-height: 68px; }
    .edit-select-wrap { position: relative; }
    .edit-select-wrap::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #6B7280; pointer-events: none; }
    .currency-wrap { position: relative; }
    .currency-wrap input { padding-left: 22px; }
    .currency-symbol { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #6B7280; pointer-events: none; }
    .edit-panel-footer { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #E5E3E0; flex-wrap: wrap; }
    .btn-save-changes { padding: 8px 18px; background: #333F48; color: #fff; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-save-changes:hover:not(:disabled) { background: #2a333c; }
    .btn-save-changes:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-cancel-edit { padding: 8px 14px; background: transparent; color: #6B7280; border: 1px solid #E5E3E0; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 13px; cursor: pointer; }
    .btn-cancel-edit:hover { border-color: #333F48; color: #333F48; }
    .edit-save-msg { font-size: 12px; font-weight: 600; color: #2D6A4F; display: none; }
    .likelihood-badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .lh-badge-high   { background: #EAF5EF; color: #2D6A4F; }
    .lh-badge-medium { background: #FEF3E2; color: #B7791F; }
    .lh-badge-low    { background: #FDEDF0; color: #9B2335; }

    tbody tr.row-active { background: #FAFAF9; }
    .btn-view-edit { padding: 5px 12px; background: transparent; color: #333F48; border: 1px solid #E5E3E0; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: border-color 0.15s; white-space: nowrap; }
    .btn-view-edit:hover, .btn-view-edit.active { border-color: #333F48; background: #F5F4F2; }
    .btn-detail { padding: 5px 10px; background: #F5F4F2; color: #333F48; border: 1px solid #E5E3E0; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 500; text-decoration: none; white-space: nowrap; }
    .btn-detail:hover { background: #E5E3E0; text-decoration: none; }
    .summary-line { font-size: 13px; color: #6B7280; margin-bottom: 10px; }
    .summary-line strong { color: #333F48; }
    .spinner-sm { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) { .summary-grid { grid-template-columns: 1fr 1fr; } .edit-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside id="sidebar"></aside>
    <main class="main-content">

      <div class="page-header">
        <h1 class="page-title">Sales Pipeline</h1>
        <p class="page-subtitle">Active opportunities — Sales and Preliminaries phase</p>
      </div>

      <!-- Actions required banner -->
      <div class="actions-banner" id="actions-banner"></div>

      <!-- Summary cards -->
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-card-label">Total Opportunities</div>
          <div class="summary-card-value" id="card-count">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">Total Pipeline Value</div>
          <div class="summary-card-value" id="card-total">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">Weighted Pipeline Value</div>
          <div class="summary-card-value" id="card-weighted">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">Market Conditions</div>
          <div class="summary-card-value" id="card-market">—</div>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <div class="filter-group grow">
          <label>Search</label>
          <input class="form-input" type="text" id="filter-search" placeholder="Project code or address…" />
        </div>
        <div class="filter-group">
          <label>Phase</label>
          <div class="form-select-wrap">
            <select class="form-select" id="filter-phase">
              <option value="">All Phases</option>
              <option value="Sales">Sales</option>
              <option value="Preliminaries">Preliminaries</option>
            </select>
          </div>
        </div>
        <div class="filter-group">
          <label>Likelihood</label>
          <div class="form-select-wrap">
            <select class="form-select" id="filter-likelihood">
              <option value="">All</option>
              <option value="High">High (70%+)</option>
              <option value="Medium">Medium (40–69%)</option>
              <option value="Low">Low (&lt;40%)</option>
            </select>
          </div>
        </div>
        <div class="filter-group">
          <label>Fiscal Year</label>
          <div class="form-select-wrap">
            <select class="form-select" id="filter-fy"><option value="">All Years</option></select>
          </div>
        </div>
        <button class="btn btn-secondary" id="btn-clear-filters">Clear</button>
      </div>

      <div class="summary-line" id="summary-line">Loading…</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Address</th>
              <th>Type</th>
              <th>Phase</th>
              <th>Budget (ex GST)</th>
              <th>Likelihood %</th>
              <th>Level</th>
              <th>Weighted Value</th>
              <th>Commence</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="projects-tbody">
            <tr><td colspan="10" style="text-align:center;padding:40px;color:#6B7280">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <button id="sidebar-hamburger" aria-label="Open menu">☰</button>
  <div id="sidebar-overlay"></div>

  <script type="module">
    import { initNav }   from "./nav.js";
    import { db }       from "./firebase-config.js";
    import {
      collection, getDocs, getDoc, doc, updateDoc, query, orderBy, where, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let allProjects       = [];
    let openEditId        = null;
    let marketConditionsPct = 1.0;

    const projectsTbody  = document.getElementById("projects-tbody");
    const summaryLine    = document.getElementById("summary-line");
    const filterSearch   = document.getElementById("filter-search");
    const filterPhase    = document.getElementById("filter-phase");
    const filterLH       = document.getElementById("filter-likelihood");
    const filterFY       = document.getElementById("filter-fy");
    const btnClear       = document.getElementById("btn-clear-filters");
    const actionsBanner  = document.getElementById("actions-banner");

    function formatCurrency(val) {
      if (val === null || val === undefined || val === "") return "—";
      return "$" + Number(val).toLocaleString("en-AU", { maximumFractionDigits: 0 });
    }
    function formatMonth(val) {
      if (!val) return "—";
      const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const p = val.split("-");
      return p.length < 2 ? val : m[parseInt(p[1])-1] + " " + p[0];
    }
    function getLikelihoodLevel(pct) {
      if (pct >= 70) return "High";
      if (pct >= 40) return "Medium";
      return "Low";
    }
    function lhClass(pct) {
      if (pct >= 70) return "lh-high";
      if (pct >= 40) return "lh-medium";
      return "lh-low";
    }
    function lhBadgeClass(level) {
      return { High:"badge-high", Medium:"badge-medium", Low:"badge-low" }[level] || "badge-medium";
    }
    function phaseBadgeClass(phase) {
      return { Sales:"badge-sales", Preliminaries:"badge-preliminaries" }[phase] || "badge-sales";
    }

    async function loadSettings() {
      try {
        const snap = await getDoc(doc(db, "settings", "global"));
        if (snap.exists() && snap.data().marketConditionsPct !== undefined)
          marketConditionsPct = parseFloat(snap.data().marketConditionsPct);
      } catch (e) { marketConditionsPct = 1.0; }
      document.getElementById("card-market").textContent = Math.round(marketConditionsPct * 100) + "%";
    }

    async function loadProjects() {
      try {
        // Fetch ALL projects — no where/orderBy on stored phase fields
        // (phase is never stored in Firestore, it is always derived from
        // milestone dates, so any index-dependent query returns 0 results).
        const snap = await getDocs(collection(db, "projects"));

        function derivePhase(p) {
          if (p.cancelledAt)     return "Cancelled";
          if (p.onHoldAt)        return "On Hold";
          if (p.completedAt)     return "Completed";
          if (p.pcClaimIssued)   return "Practical Completion";
          if (p.contractDate)    return "Construction";
          if (p.preliminaryDate) return "Preliminaries";
          return "Sales";
        }
        allProjects = [];
        snap.forEach(d => {
          const p     = d.data();
          if (p.deletedAt) return;
          const phase = derivePhase(p);
          if (phase === "Sales" || phase === "Preliminaries")
            allProjects.push({ id: d.id, ...p, _phase: phase });
        });
        // Sort by likelihood descending in JS (no index required)
        allProjects.sort((a, b) => (b.likelihoodPct || 0) - (a.likelihoodPct || 0));
        populateFYFilter();
        await checkActionsBanner();
        renderTable();
      } catch (err) {
        projectsTbody.innerHTML = `<tr><td colspan="10" style="color:#9B2335;padding:24px">Failed: ${err.message}</td></tr>`;
      }
    }

    function populateFYFilter() {
      const fySet = new Set(allProjects.map(p => p.fiscalYear).filter(Boolean));
      const sorted = Array.from(fySet).sort().reverse();
      const cur = filterFY.value;
      while (filterFY.options.length > 1) filterFY.remove(1);
      sorted.forEach(fy => { const o = document.createElement("option"); o.value = o.textContent = fy; filterFY.appendChild(o); });
      if (cur) filterFY.value = cur;
    }

    async function checkActionsBanner() {
      // Find projects at 50%+ likelihood with no indicative claim schedule
      const highLH = allProjects.filter(p => (p.likelihoodPct || 0) >= 0.5);
      const needsSchedule = [];
      await Promise.all(highLH.map(async p => {
        try {
          const snap = await getDocs(collection(db, "projects", p.id, "claimschedule"));
          if (snap.empty) needsSchedule.push(p);
        } catch (e) {}
      }));
      if (needsSchedule.length > 0) {
        actionsBanner.innerHTML = `⚠ <strong>${needsSchedule.length} opportunit${needsSchedule.length===1?"y":"ies"}</strong> at 50%+ likelihood require an indicative claim schedule. ` +
          needsSchedule.map(p => `<a href="project-detail.html?projectId=${p.id}" style="color:#B7791F;font-weight:600">${p.projectCode||p.id}</a>`).join(", ");
        actionsBanner.classList.add("show");
      } else {
        actionsBanner.classList.remove("show");
      }
    }

    function getFiltered() {
      const search = filterSearch.value.trim().toLowerCase();
      const phase  = filterPhase.value;
      const lh     = filterLH.value;
      const fy     = filterFY.value;
      return allProjects.filter(p => {
        if (search) {
          const code = (p.projectCode||"").toLowerCase();
          const addr = (p.projectAddress||"").toLowerCase();
          if (!code.includes(search) && !addr.includes(search)) return false;
        }
        if (phase && p._phase          !== phase) return false;
        if (lh    && p.likelihoodLevel !== lh)    return false;
        if (fy    && p.fiscalYear      !== fy)    return false;
        return true;
      });
    }

    function updateSummaryCards(filtered) {
      const count    = filtered.length;
      const total    = filtered.reduce((s, p) => s + (p.estimatedBudget||0), 0);
      const weighted = filtered.reduce((s, p) => s + (p.estimatedBudget||0) * (p.likelihoodPct||0) * marketConditionsPct, 0);
      document.getElementById("card-count").textContent    = count;
      document.getElementById("card-total").textContent    = formatCurrency(total);
      document.getElementById("card-weighted").textContent = formatCurrency(weighted);
    }

    function renderTable() {
      const filtered = getFiltered();
      summaryLine.innerHTML = `Showing <strong>${filtered.length}</strong> of <strong>${allProjects.length}</strong> Sales &amp; Prelim opportunit${allProjects.length!==1?"ies":"y"}`;
      updateSummaryCards(filtered);

      if (filtered.length === 0) {
        projectsTbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:40px;color:#6B7280">${allProjects.length===0?"No Sales or Preliminaries projects found.":"No projects match the current filters."}</td></tr>`;
        return;
      }
      if (openEditId && !filtered.find(p => p.id === openEditId)) openEditId = null;

      projectsTbody.innerHTML = filtered.map(proj => {
        const isOpen = openEditId === proj.id;
        const pct    = Math.round((proj.likelihoodPct||0)*100);
        const wt     = (proj.estimatedBudget||0) * (proj.likelihoodPct||0) * marketConditionsPct;
        return `
          <tr class="${isOpen?"row-active":""}" data-id="${proj.id}">
            <td><strong>${proj.projectCode||"—"}</strong></td>
            <td class="muted">${proj.projectAddress||"—"}</td>
            <td>${proj.projectType||"—"}</td>
            <td><span class="badge ${phaseBadgeClass(proj._phase)}">${proj._phase||"—"}</span></td>
            <td>${formatCurrency(proj.estimatedBudget)}</td>
            <td class="${lhClass(proj.likelihoodPct)}">${pct}%</td>
            <td><span class="badge ${lhBadgeClass(proj.likelihoodLevel)}">${proj.likelihoodLevel||"—"}</span></td>
            <td>${formatCurrency(wt)}</td>
            <td class="muted">${formatMonth(proj.expectedCommencementMonth)}</td>
            <td style="white-space:nowrap;display:flex;gap:6px;align-items:center">
              <button class="btn-view-edit ${isOpen?"active":""}" onclick="toggleEditPanel('${proj.id}')">${isOpen?"Close":"View / Edit"}</button>
              <a class="btn-detail" href="project-detail.html?projectId=${proj.id}">Detail</a>
            </td>
          </tr>
          ${isOpen ? buildEditPanel(proj) : ""}`;
      }).join("");
    }

    function buildEditPanel(proj) {
      const pct      = Math.round((proj.likelihoodPct||0)*100);
      const lhLevel  = getLikelihoodLevel(pct);
      const lhBdgCls = { High:"lh-badge-high", Medium:"lh-badge-medium", Low:"lh-badge-low" }[lhLevel] || "lh-badge-medium";
      return `
        <tr class="edit-panel-row">
          <td colspan="10">
            <div class="edit-panel">
              <div class="edit-panel-title">Edit — ${proj.projectCode||proj.id}</div>
              <div class="edit-grid">
                <div class="edit-group">
                  <label>Project Phase (read only)</label>
                  <div style="padding:8px 10px;background:#F5F4F2;border:1px solid #E5E3E0;border-radius:6px;font-size:13px;color:#333F48">
                    <span class="badge ${phaseBadgeClass(proj._phase)}">${proj._phase||"—"}</span>
                  </div>
                </div>
                <div class="edit-group">
                  <label>Likelihood %</label>
                  <input type="number" id="ep-likelihoodPct-${proj.id}" value="${pct}" min="0" max="100" step="5" oninput="updateLhBadge('${proj.id}')" />
                </div>
                <div class="edit-group">
                  <label>Likelihood Level</label>
                  <div style="padding-top:6px"><span class="likelihood-badge ${lhBdgCls}" id="ep-lh-badge-${proj.id}">${lhLevel}</span></div>
                </div>
                <div class="edit-group">
                  <label>Expected Commencement</label>
                  <input type="month" id="ep-expectedCommencement-${proj.id}" value="${proj.expectedCommencementMonth||""}" />
                </div>
                <div class="edit-group">
                  <label>Estimated Budget (ex GST)</label>
                  <div class="currency-wrap">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="ep-estimatedBudget-${proj.id}" value="${proj.estimatedBudget??""}" min="0" step="1000" />
                  </div>
                </div>
                <div class="edit-group">
                  <label>Sales Person</label>
                  <div class="edit-select-wrap">
                    <select id="ep-salesPerson-${proj.id}"><option value="">— Unassigned —</option></select>
                  </div>
                </div>
                <div class="edit-group span-3">
                  <label>Pipeline Notes</label>
                  <textarea id="ep-pipelineNotes-${proj.id}">${proj.pipelineNotes||""}</textarea>
                </div>
              </div>
              <div class="edit-panel-footer">
                <button class="btn-save-changes" id="ep-save-btn-${proj.id}" onclick="saveProjectChanges('${proj.id}')">Save Changes</button>
                <button class="btn-cancel-edit" onclick="closeEditPanel()">Cancel</button>
                <span class="edit-save-msg" id="ep-save-msg-${proj.id}">✓ Saved</span>
              </div>
            </div>
          </td>
        </tr>`;
    }

    window.toggleEditPanel = function(projId) {
      openEditId = openEditId === projId ? null : projId;
      renderTable();
      if (openEditId) {
        const p = allProjects.find(p => p.id === projId);
        if (p) populateSalesDropdown(projId, p.salesPersonId||"");
      }
    };
    window.closeEditPanel = function() { openEditId = null; renderTable(); };

    window.updateLhBadge = function(projId) {
      const pct   = parseInt(document.getElementById(`ep-likelihoodPct-${projId}`)?.value)||0;
      const level = getLikelihoodLevel(pct);
      const badge = document.getElementById(`ep-lh-badge-${projId}`);
      if (!badge) return;
      const cls = { High:"lh-badge-high", Medium:"lh-badge-medium", Low:"lh-badge-low" }[level] || "lh-badge-medium";
      badge.textContent = level; badge.className = "likelihood-badge " + cls;
    };

    async function populateSalesDropdown(projId, currentId) {
      const select = document.getElementById(`ep-salesPerson-${projId}`);
      if (!select) return;
      try {
        const snap = await getDocs(query(collection(db, "staffmembers"), where("isActive","==",true), orderBy("lastName","asc")));
        snap.forEach(d => {
          const s = d.data();
          if (["Sales","Director","sales","director"].includes(s.role)) {
            const o = document.createElement("option");
            o.value = d.id; o.textContent = ((s.firstName||"")+" "+(s.lastName||"")).trim();
            if (d.id === currentId) o.selected = true;
            select.appendChild(o);
          }
        });
      } catch (e) {}
    }

    window.saveProjectChanges = async function(projId) {
      const saveBtn = document.getElementById(`ep-save-btn-${projId}`);
      const saveMsg = document.getElementById(`ep-save-msg-${projId}`);
      if (!saveBtn) return;
      saveBtn.disabled = true; saveBtn.innerHTML = '<span class="spinner-sm"></span> Saving…';
      try {
        const pctVal    = parseInt(document.getElementById(`ep-likelihoodPct-${projId}`).value)||0;
        const budgetVal = document.getElementById(`ep-estimatedBudget-${projId}`).value;
        const updates = {
          likelihoodPct:             pctVal / 100,
          likelihoodLevel:           getLikelihoodLevel(pctVal),
          expectedCommencementMonth: document.getElementById(`ep-expectedCommencement-${projId}`).value,
          estimatedBudget:           budgetVal ? parseFloat(budgetVal) : null,
          salesPersonId:             document.getElementById(`ep-salesPerson-${projId}`).value,
          pipelineNotes:             document.getElementById(`ep-pipelineNotes-${projId}`).value.trim(),
          updatedAt:                 serverTimestamp()
        };
        await updateDoc(doc(db, "projects", projId), updates);
        const idx = allProjects.findIndex(p => p.id === projId);
        if (idx > -1) {
          allProjects[idx] = { ...allProjects[idx], ...updates };
          allProjects[idx]._phase = derivePhase(allProjects[idx]);
        }
        saveMsg.style.display = "inline";
        setTimeout(() => { saveMsg.style.display = "none"; }, 3000);
        renderTable();
      } catch (err) {
        alert("Failed to save: " + err.message);
      } finally {
        if (saveBtn) { saveBtn.disabled = false; saveBtn.innerHTML = "Save Changes"; }
      }
    };

    filterSearch.addEventListener("input",   renderTable);
    filterPhase.addEventListener("change",   renderTable);
    filterLH.addEventListener("change",      renderTable);
    filterFY.addEventListener("change",      renderTable);
    btnClear.addEventListener("click", () => {
      filterSearch.value = ""; filterPhase.value = "";
      filterLH.value = ""; filterFY.value = "";
      renderTable();
    });

    initNav({
      pageId: "project-list",
      allowedRoles: [],
      onReady: async (user, role) => {
        await Promise.all([loadSettings(), loadProjects()]);
      }
    });
  </script>
</body>
